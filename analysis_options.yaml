analyzer:
  exclude:
    - build/**
    - macos/**
    # Forked re_editor keeps upstream's code style (packages/re_editor/JBE_CHANGES.md).
    - packages/**
    # Generated by gen-l10n; it still references the deprecated
    # flutter_localizations delegates (app.dart uses material_ui's instead).
    - lib/l10n/app_localizations*.dart
include: package:flutter_lints/flutter.yaml
